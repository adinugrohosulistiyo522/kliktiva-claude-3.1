function publicCacheSave(data){try{const copy=JSON.parse(JSON.stringify(data||{}));copy.profile=copy.profile||{};copy.profile.websiteCtaEnabled='false';delete copy.profile.websiteCtaWhatsapp;localStorage.setItem(PUBLIC_CACHE_KEY,JSON.stringify({savedAt:Date.now(),data:copy}));}catch(e){}}
function publicCacheRead(){try{const raw=localStorage.getItem(PUBLIC_CACHE_KEY);if(!raw)return null;const obj=JSON.parse(raw);if(!obj||!obj.data||Date.now()-Number(obj.savedAt||0)>24*60*60*1000)return null;obj.data.profile=obj.data.profile||{};obj.data.profile.websiteCtaEnabled='false';delete obj.data.profile.websiteCtaWhatsapp;return obj.data;}catch(e){return null;}}
function showCatalogStatus(message,kind='info',showRetry=false){const host=$('catalogStatus');if(!host)return;host.replaceChildren();if(!message){host.classList.add('hidden');host.classList.remove('error');return;}host.classList.remove('hidden');host.classList.toggle('error',kind==='error');host.appendChild(el('span','',message));if(showRetry){const b=el('button','',t('retry'));b.type='button';b.addEventListener('click',()=>refreshPublicSite({force:true,manual:true}));host.appendChild(b);}}
function showCatalogSkeleton(){const host=$('collectionsGrid');if(!host||host.children.length)return;for(let i=0;i<4;i++)host.appendChild(el('div','collection-skeleton'));}
function renderData(d,options={}){
 const preserveView=!!options.preserveView;
 const previousTab=$('linksView').classList.contains('active')?'links':'collection';
 const previousCollection=CURRENT_COLLECTION;
 PROFILE=d.profile||{};PRODUCTS=Array.isArray(d.products)?d.products:[];COLLECTIONS=Array.isArray(d.collections)?d.collections:[];
 renderProfile();renderSocials();renderCollections();setLanguage(LANG);
 if(preserveView){setTab(previousTab);if(previousCollection!==null&&previousCollection!==undefined){if(findCollection(previousCollection))openCollection(previousCollection);else closeCollection();}else closeCollection();}
 else {setTab('collection');closeCollection();}
 renderWebsiteCta();showCatalogStatus('');
 if(options.trackPageView&&!publicPageViewTracked){publicPageViewTracked=true;trackEvent('page_view','',PROFILE.name||'');}
 if(options.saveCache!==false)publicCacheSave(d);
}
function definitiveInactiveLicense(state){return state&&state.active===false&&state.reason!=='LICENSE_SERVER_UNAVAILABLE'&&state.reason!=='LICENSE_SERVER_BAD_RESPONSE'&&state.reason!=='LICENSE_API_NOT_CONFIGURED';}
async function refreshPublicSite(options={}){
 if(publicRefreshRunning)return false;
 if(document.hidden&&!options.force)return false;
 publicRefreshRunning=true;
 if(!PRODUCTS.length&&!COLLECTIONS.length&&options.initial)showCatalogStatus(t('loadingCatalog'));
 try{
   const state=await API('getLicenseStatus');
   if(definitiveInactiveLicense(state)){licenseGate(state.message||t('licenseText'));return false;}
   if(state.active!==true){showCatalogStatus(t('connectionRetry'), 'error', true);return false;}
   const data=await API('getPublicData');
   renderData(data,{preserveView:!!options.preserveView,trackPageView:!publicPageViewTracked,saveCache:true});
   lastPublicHeartbeat=Date.now();
   return true;
 }catch(e){
   if(e&&e.code==='LICENSE_BLOCKED'){licenseGate(e.message||t('licenseText'));return false;}
   console.warn('[Project Bio public refresh] temporary failure',e&&e.code?e.code:e);
   showCatalogStatus(t('connectionRetry'),'error',true);
   return false;
 }finally{publicRefreshRunning=false;}
}
function startup(){
 // Render the public shell immediately; only the collection/catalog panel gets a local loading state.
 showScreen('publicApp');
 const cached=publicCacheRead();
 if(cached){renderData(cached,{preserveView:false,trackPageView:false,saveCache:false});showCatalogStatus(t('updatingCatalog'));}
 else {renderProfile();renderSocials();setTab('collection');showCatalogSkeleton();showCatalogStatus(t('loadingCatalog'));}
 refreshPublicSite({initial:true,force:true});
}
$('retryButton').addEventListener('click',()=>refreshPublicSite({force:true,manual:true}));
setLanguage(LANG); // Initial localization must not call an undefined bootstrap function.
async function recheckPublicLicense(){
 if(ADMIN_PREVIEW_MODE||publicRefreshRunning||!$('publicApp')||$('publicApp').classList.contains('hidden')||document.hidden)return;
 if(Date.now()-lastPublicHeartbeat<4.8*60*1000)return;
 await refreshPublicSite({preserveView:true,force:true});
}
if(ADMIN_PREVIEW_MODE){
  // A preview must always reveal the actual public shell, even before Admin sends its draft.
  // This mode deliberately skips license checks, Analytics events and persistent public cache.
  showScreen('publicApp');
  try{renderData({profile:{},products:[],collections:[]},{preserveView:false,trackPageView:false,saveCache:false});setTab('collection');}catch(previewInitError){console.warn('[Project Bio preview] initial shell render failed',previewInitError);}
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==window.parent||!event.data||event.data.type!=='PBAT_ADMIN_PREVIEW_DATA')return;
    const payload=event.data.payload;if(!payload||!payload.profile||!Array.isArray(payload.products)||!Array.isArray(payload.collections))return;
    try{
      if(payload.language==='en'||payload.language==='id')setLanguage(payload.language);
      renderData(payload,{preserveView:true,trackPageView:false,saveCache:false});
      window.parent.postMessage({type:'PBAT_ADMIN_PREVIEW_RENDERED'},location.origin);
    }catch(previewRenderError){
      console.warn('[Project Bio preview] draft render failed',previewRenderError);
      window.parent.postMessage({type:'PBAT_ADMIN_PREVIEW_ERROR',message:String(previewRenderError&&previewRenderError.message||previewRenderError)},location.origin);
    }
  });
  window.parent.postMessage({type:'PBAT_ADMIN_PREVIEW_READY'},location.origin);
} else {
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastPublicHeartbeat>=4.8*60*1000)recheckPublicLicense();});
  setInterval(recheckPublicLicense,5*60*1000);
  startup();
}
</script></body></html>
